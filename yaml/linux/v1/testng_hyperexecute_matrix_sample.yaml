---
version: "0.1"
runson: linux
concurrency: 1
retryOnFailure: false
maxRetries: 0
globalTimeout: 10
testSuiteTimeout: 10
testSuiteStep: 5
runtime:
  language: python
  version: "3.10"
pre:
  - pip install pytest
testDiscovery:
  type: raw
  mode: dynamic
  command: ls cases/pass.sh
testRunnerCommand: bash cases/pass.sh
